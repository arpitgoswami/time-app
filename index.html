<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Flip Clock</title>
    <meta name="theme-color" content="#000000" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="icon" href="./favicon.ico" />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@600&family=Bebas+Neue&family=Big+Shoulders+Display:wght@700&family=Oswald:wght@600&family=Teko:wght@600&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script
      src="https://kit.fontawesome.com/97fba59076.js"
      crossorigin="anonymous"
    ></script>
    <style>
      :root {
        --s: min(28vw, 60vh); /* card size */
        --r: calc(var(--s) * 0.113); /* corner radius */
        --card: #111111; /* card background */
        --ink: #a0a0a0; /* digit + date colour */
        --page: #000000; /* page background */
        --font: "Bebas Neue";
        --fw: 400;
        --fscale: 0.95; /* digit size, auto-measured per font */
        --fy: 0.05; /* vertical centring, auto-measured per font */
        --dur: 0.3s;
      }
      html,
      body {
        height: 100%;
        background: var(--page);
        overscroll-behavior: none;
        transition: background 0.3s;
      }
      body {
        font-family: var(--font), "Bebas Neue", Impact, sans-serif;
        font-weight: var(--fw);
        color: var(--ink);
        user-select: none;
        -webkit-user-select: none;
        touch-action: pan-y;
      }

      .track {
        transition: transform 0.5s cubic-bezier(0.65, 0, 0.25, 1);
      }
      .gap-cards {
        gap: calc(var(--s) * 0.15);
      }
      .meta {
        font-size: calc(var(--s) * 0.075);
        letter-spacing: 0.02em;
        line-height: 1;
        margin-bottom: calc(var(--s) * 0.09);
        color: var(--ink);
      }

      /* ---- flip card ---- */
      .flip {
        position: relative;
        width: var(--s);
        height: var(--s);
        perspective: calc(var(--s) * 3);
      }
      .half {
        position: absolute;
        left: 0;
        width: 100%;
        height: 50%;
        overflow: hidden;
        background: var(--card);
        backface-visibility: hidden;
        transition: background 0.3s;
      }
      .half > span {
        position: absolute;
        left: 0;
        width: 100%;
        height: 200%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font), "Bebas Neue", Impact, sans-serif;
        font-weight: var(--fw);
        font-size: calc(var(--s) * var(--fscale));
        line-height: 1;
        letter-spacing: 0.02em;
        color: var(--ink);
        transform: translateY(calc(var(--fy) * 1em));
      }
      .up,
      .flap-top {
        top: 0;
        border-radius: var(--r) var(--r) 0 0;
      }
      .up > span,
      .flap-top > span {
        top: 0;
      }
      .down,
      .flap-bot {
        top: 50%;
        border-radius: 0 0 var(--r) var(--r);
      }
      .down > span,
      .flap-bot > span {
        top: -100%;
      }
      .line {
        position: absolute;
        left: 0;
        right: 0;
        top: 50%;
        height: 1%;
        transform: translateY(-50%);
        background: var(--page);
        z-index: 5;
      }

      .flap-top {
        transform-origin: bottom;
        visibility: hidden;
        z-index: 3;
      }
      .flap-bot {
        transform-origin: top;
        visibility: hidden;
        transform: rotateX(90deg);
        z-index: 3;
      }
      .flipping .flap-top {
        visibility: visible;
        animation: topflip var(--dur) ease-in forwards;
      }
      .flipping .flap-bot {
        visibility: visible;
        animation: botflip var(--dur) var(--dur) ease-out both;
      }
      @keyframes topflip {
        from {
          transform: rotateX(0);
          filter: brightness(1);
        }
        to {
          transform: rotateX(-90deg);
          filter: brightness(0.6);
        }
      }
      @keyframes botflip {
        from {
          transform: rotateX(90deg);
          filter: brightness(0.6);
        }
        to {
          transform: rotateX(0);
          filter: brightness(1);
        }
      }

      /* ---- controls: minimal round icon buttons (fixed neutral look so they stay readable on any theme) ---- */
      .item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.5em;
      }
      .ibtn {
        position: relative;
        display: grid;
        place-items: center;
        width: max(34px, calc(var(--s) * 0.125));
        height: max(34px, calc(var(--s) * 0.125));
        border-radius: 50%;
        background: #181818;
        color: #d8d8d8;
        font-size: max(13px, calc(var(--s) * 0.048));
        transition:
          transform 0.15s,
          background 0.2s,
          border-color 0.2s;
      }
      .ibtn:hover {
        border-color: rgba(200, 200, 200, 0.6);
      }
      .ibtn:active {
        transform: scale(0.92);
        background: #2a2a2a;
      }
      .ibtn:focus-visible {
        outline: 2px solid #d8d8d8;
        outline-offset: 3px;
      }
      .ibtn[disabled] {
        opacity: 0.35;
        pointer-events: none;
      }
      .ibtn .sw {
        position: absolute;
        right: 1px;
        bottom: 1px;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.55);
      }
      .cap {
        font-family: var(--font), "Bebas Neue", Impact, sans-serif;
        font-weight: var(--fw);
        font-size: max(10px, calc(var(--s) * 0.04));
        letter-spacing: 0.08em;
        line-height: 1;
        color: var(--ink);
        opacity: 0.7;
      }
      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--ink);
        opacity: 0.3;
        transition:
          opacity 0.3s,
          transform 0.3s;
      }
      .dot.on {
        opacity: 0.9;
        transform: scale(1.25);
      }

      @media (prefers-reduced-motion: reduce) {
        .track {
          transition: none;
        }
        .flipping .flap-top,
        .flipping .flap-bot {
          animation-duration: 0.01s;
          animation-delay: 0s;
        }
      }
    </style>
  </head>
  <body class="overflow-hidden">
    <div id="viewport" class="relative w-screen h-[100dvh] overflow-hidden">
      <div id="track" class="track flex h-full" style="width: 300vw">
        <!-- 1 · CLOCK -->
        <section
          class="w-screen h-full flex flex-col items-center justify-center shrink-0"
        >
          <div id="date" class="meta">--</div>
          <div class="flex gap-cards">
            <div class="flip" id="c-h"></div>
            <div class="flip" id="c-m"></div>
            <div class="flip" id="c-s"></div>
          </div>
        </section>

        <!-- 2 · STOPWATCH -->
        <section
          class="w-screen h-full flex flex-col items-center justify-center shrink-0"
        >
          <div class="meta">STOPWATCH</div>
          <div class="flex gap-cards">
            <div class="flip" id="w-h"></div>
            <div class="flip" id="w-m"></div>
            <div class="flip" id="w-s"></div>
          </div>
          <div class="flex gap-3 mt-[calc(var(--s)*0.08)]">
            <button
              id="toggle"
              class="ibtn"
              aria-label="Start"
              title="Start / Stop"
            >
              <i id="toggle-i" class="fa-solid fa-play"></i>
            </button>
            <button id="reset" class="ibtn" aria-label="Reset" title="Reset">
              <i class="fa-solid fa-rotate-left"></i>
            </button>
          </div>
        </section>

        <!-- 3 · SETTINGS -->
        <section
          class="w-screen h-full flex flex-col items-center justify-center shrink-0"
        >
          <div class="meta">SETTINGS</div>
          <div
            class="flex flex-wrap justify-center gap-x-6 gap-y-4 w-[84vw] max-w-[900px]"
          >
            <div class="item">
              <button
                id="b-full"
                class="ibtn"
                aria-label="Toggle fullscreen"
                title="Fullscreen"
              >
                <i id="i-full" class="fa-solid fa-expand"></i></button
              ><span class="cap" id="cap-full">FULLSCREEN</span>
            </div>
            <div class="item">
              <button
                id="b-font"
                class="ibtn"
                aria-label="Change font"
                title="Font"
              >
                <i class="fa-solid fa-font"></i></button
              ><span class="cap" id="cap-font">FONT</span>
            </div>
            <div class="item">
              <button
                id="b-ink"
                class="ibtn"
                aria-label="Change font color"
                title="Font color"
              >
                <i class="fa-solid fa-palette"></i
                ><span class="sw" id="s-ink"></span></button
              ><span class="cap">FONT COLOR</span>
            </div>
            <div class="item">
              <button
                id="b-page"
                class="ibtn"
                aria-label="Change background color"
                title="Background"
              >
                <i class="fa-solid fa-fill-drip"></i
                ><span class="sw" id="s-page"></span></button
              ><span class="cap">BACKGROUND</span>
            </div>
            <div class="item">
              <button
                id="b-card"
                class="ibtn"
                aria-label="Change text background color"
                title="Text background"
              >
                <i class="fa-solid fa-highlighter"></i
                ><span class="sw" id="s-card"></span></button
              ><span class="cap">TEXT BG</span>
            </div>
          </div>
        </section>
      </div>

      <div
        class="absolute left-0 right-0 flex justify-center gap-2"
        style="bottom: calc(env(safe-area-inset-bottom, 0px) + 16px)"
      >
        <span class="dot on"></span><span class="dot"></span
        ><span class="dot"></span>
      </div>
    </div>

    <script>
      const pad = (n) => String(n).padStart(2, "0");

      /* ================= flip card ================= */
      class Flip {
        constructor(root) {
          this.root = root;
          root.innerHTML =
            '<div class="half up"><span></span></div>' +
            '<div class="half down"><span></span></div>' +
            '<div class="half flap-top"><span></span></div>' +
            '<div class="half flap-bot"><span></span></div>' +
            '<div class="line"></div>';
          const s = (sel) => root.querySelector(sel + " > span");
          this.up = s(".up");
          this.down = s(".down");
          this.ft = s(".flap-top");
          this.fb = s(".flap-bot");
          this.value = null;
          this.timer = null;
        }
        finish() {
          clearTimeout(this.timer);
          this.root.classList.remove("flipping");
          this.down.textContent = this.value;
        }
        set(v) {
          if (v === this.value) return;
          if (this.value === null) {
            this.value = v;
            this.up.textContent =
              this.down.textContent =
              this.ft.textContent =
              this.fb.textContent =
                v;
            return;
          }
          this.finish();
          const old = this.value;
          this.value = v;
          this.up.textContent = v;
          this.down.textContent = old;
          this.ft.textContent = old;
          this.fb.textContent = v;
          void this.root.offsetWidth;
          this.root.classList.add("flipping");
          this.timer = setTimeout(() => this.finish(), 620);
        }
      }

      const clock = ["c-h", "c-m", "c-s"].map(
        (id) => new Flip(document.getElementById(id)),
      );
      const watch = ["w-h", "w-m", "w-s"].map(
        (id) => new Flip(document.getElementById(id)),
      );
      const setAll = (cards, h, m, s) => {
        cards[0].set(pad(h));
        cards[1].set(pad(m));
        cards[2].set(pad(s));
      };

      /* ================= clock (set TWELVE_HOUR = true for 12-hour) ================= */
      const TWELVE_HOUR = false;
      const dateEl = document.getElementById("date");
      function tickClock() {
        const d = new Date();
        let h = d.getHours();
        if (TWELVE_HOUR) h = h % 12 || 12;
        setAll(clock, h, d.getMinutes(), d.getSeconds());
        const dd =
          pad(d.getDate()) +
          "-" +
          pad(d.getMonth() + 1) +
          "-" +
          pad(d.getFullYear() % 100);
        dateEl.textContent =
          dd +
          "  " +
          d.toLocaleDateString("en-US", { weekday: "long" }).toUpperCase();
      }
      tickClock();
      setInterval(tickClock, 250);

      /* ================= stopwatch ================= */
      let running = false,
        elapsed = 0,
        startedAt = 0;
      const toggleBtn = document.getElementById("toggle");
      function tickWatch() {
        const ms = running
          ? elapsed + (performance.now() - startedAt)
          : elapsed;
        const t = Math.floor(ms / 1000);
        setAll(watch, Math.floor(t / 3600), Math.floor(t / 60) % 60, t % 60);
      }
      tickWatch();
      setInterval(tickWatch, 100);
      const toggleIcon = document.getElementById("toggle-i");
      function paintToggle() {
        toggleIcon.className = running
          ? "fa-solid fa-pause"
          : "fa-solid fa-play";
        toggleBtn.setAttribute("aria-label", running ? "Stop" : "Start");
      }
      toggleBtn.addEventListener("click", () => {
        if (running) {
          elapsed += performance.now() - startedAt;
          running = false;
        } else {
          startedAt = performance.now();
          running = true;
        }
        paintToggle();
        tickWatch();
      });
      document.getElementById("reset").addEventListener("click", () => {
        running = false;
        elapsed = 0;
        paintToggle();
        tickWatch();
      });

      /* ================= settings ================= */
      const FONTS = [
        { name: "Bebas Neue", w: 400 },
        { name: "Oswald", w: 600 },
        { name: "Anton", w: 400 },
        { name: "Barlow Condensed", w: 600 },
        { name: "Big Shoulders Display", w: 700 },
        { name: "Teko", w: 600 },
      ];
      const INKS = [
        "#a0a0a0",
        "#ffffff",
        "#ffb000",
        "#39ff88",
        "#ff5a5a",
        "#4dd0e1",
        "#ff7ad9",
        "#111111",
      ];
      const PAGES = [
        "#000000",
        "#0b1020",
        "#1a0d0d",
        "#0d1a12",
        "#2b2b2b",
        "#e9e9e9",
        "#ffffff",
      ];
      const CARDS = [
        "#111111",
        "#000000",
        "#1f1f1f",
        "#2a1a3a",
        "#1a2a3a",
        "#3a1a1a",
        "#e0e0e0",
        "#ffffff",
      ];

      let st = { font: 0, ink: 0, page: 0, card: 0 };
      try {
        Object.assign(
          st,
          JSON.parse(localStorage.getItem("flipclock-settings") || "{}"),
        );
      } catch (e) {}
      const save = () => {
        try {
          localStorage.setItem("flipclock-settings", JSON.stringify(st));
        } catch (e) {}
      };
      const root = document.documentElement.style;
      const $ = (id) => document.getElementById(id);

      /* measure each font's digit height & vertical centre so every font sits centred in the card */
      const metricsCache = {};
      const ctx = document.createElement("canvas").getContext("2d");
      async function fontMetrics(f) {
        if (metricsCache[f.name]) return metricsCache[f.name];
        try {
          await document.fonts.load(`${f.w} 100px "${f.name}"`, "0123456789");
        } catch (e) {}
        let m = { scale: 0.95, dy: 0.05 };
        try {
          const P = 200;
          ctx.font = `${f.w} ${P}px "${f.name}"`;
          const t = ctx.measureText("0");
          const asc = t.actualBoundingBoxAscent / P,
            desc = t.actualBoundingBoxDescent / P;
          const fa = t.fontBoundingBoxAscent / P,
            fd = t.fontBoundingBoxDescent / P;
          if (asc + desc > 0 && fa + fd > 0) {
            const baseline = (1 - (fa + fd)) / 2 + fa; // baseline from top of a line-height:1 box
            const centre = baseline - (asc - desc) / 2; // glyph centre from top
            m = { scale: 0.665 / (asc + desc), dy: 0.5 - centre };
          }
        } catch (e) {}
        return (metricsCache[f.name] = m);
      }
      async function applyFont() {
        const f = FONTS[st.font];
        const m = await fontMetrics(f);
        root.setProperty("--font", `'${f.name}'`);
        root.setProperty("--fw", f.w);
        root.setProperty("--fscale", m.scale.toFixed(3));
        root.setProperty("--fy", m.dy.toFixed(3));
        $("cap-font").textContent = f.name.toUpperCase();
      }
      function applyColors() {
        root.setProperty("--ink", INKS[st.ink]);
        root.setProperty("--page", PAGES[st.page]);
        root.setProperty("--card", CARDS[st.card]);
        $("s-ink").style.background = INKS[st.ink];
        $("s-page").style.background = PAGES[st.page];
        $("s-card").style.background = CARDS[st.card];
        document.querySelector("meta[name=theme-color]").content =
          PAGES[st.page];
      }
      applyColors();
      applyFont();
      document.fonts.ready.then(applyFont);

      $("b-font").onclick = () => {
        st.font = (st.font + 1) % FONTS.length;
        applyFont();
        save();
      };
      $("b-ink").onclick = () => {
        st.ink = (st.ink + 1) % INKS.length;
        applyColors();
        save();
      };
      $("b-page").onclick = () => {
        st.page = (st.page + 1) % PAGES.length;
        applyColors();
        save();
      };
      $("b-card").onclick = () => {
        st.card = (st.card + 1) % CARDS.length;
        applyColors();
        save();
      };

      /* fullscreen toggle */
      const fsBtn = $("b-full");
      const fsEl = () =>
        document.fullscreenElement || document.webkitFullscreenElement;
      const canFS =
        document.documentElement.requestFullscreen ||
        document.documentElement.webkitRequestFullscreen;
      function fsLabel() {
        const on = !!fsEl();
        $("i-full").className = on
          ? "fa-solid fa-compress"
          : "fa-solid fa-expand";
        $("cap-full").textContent = on ? "EXIT FULLSCREEN" : "FULLSCREEN";
      }
      if (!canFS) {
        fsBtn.disabled = true;
        $("cap-full").textContent = "UNAVAILABLE";
      }
      fsBtn.onclick = () => {
        if (!canFS) return;
        if (fsEl())
          (document.exitFullscreen || document.webkitExitFullscreen).call(
            document,
          );
        else
          (
            document.documentElement.requestFullscreen ||
            document.documentElement.webkitRequestFullscreen
          ).call(document.documentElement);
      };
      document.addEventListener("fullscreenchange", fsLabel);
      document.addEventListener("webkitfullscreenchange", fsLabel);

      /* ================= swipe between screens ================= */
      const track = $("track");
      const dots = [...document.querySelectorAll(".dot")];
      let mode = 0;
      function go(m) {
        mode = Math.max(0, Math.min(2, m));
        track.style.transform = `translateX(${(-100 / 3) * mode}%)`;
        dots.forEach((d, i) => d.classList.toggle("on", i === mode));
      }
      let sx = null,
        sy = null;
      const vp = $("viewport");
      vp.addEventListener("pointerdown", (e) => {
        sx = e.clientX;
        sy = e.clientY;
      });
      vp.addEventListener("pointerup", (e) => {
        if (sx === null) return;
        const dx = e.clientX - sx,
          dy = e.clientY - sy;
        sx = null;
        if (Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy)) return;
        go(mode + (dx < 0 ? 1 : -1)); // swipe left → next, swipe right → previous
      });
      vp.addEventListener("pointercancel", () => {
        sx = null;
      });
      addEventListener("keydown", (e) => {
        if (e.key === "ArrowLeft") go(mode + 1);
        if (e.key === "ArrowRight") go(mode - 1);
        if (mode === 1 && e.code === "Space") {
          e.preventDefault();
          toggleBtn.click();
        }
      });
    </script>
  </body>
</html>
